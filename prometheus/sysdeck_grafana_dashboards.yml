apiVersion: 1

providers:
  - name: 'SysDeck Dashboards'
    orgId: 1
    folder: 'SysDeck'
    folderUid: 'sysdeck'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/sysdeck
      foldersFromFilesStructure: false
