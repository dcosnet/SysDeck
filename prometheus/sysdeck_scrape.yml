# SysDeck Module Scrape Configuration
# Add these scrape configs to /etc/prometheus/prometheus.yml
# or include via: - prometheus/sysdeck_scrape.yml

scrape_configs:
  # ── SysDeck Log Pipeline (Pushgateway) ───────────────────────
  - job_name: 'sysdeck_logs'
    honor_labels: true
    static_configs:
      - targets: ['localhost:9091']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'sysdeck_.*'
        action: keep

  # ── SysDeck Bridge Health Endpoints ──────────────────────────
  # Each bridge module exposes a /metrics endpoint when instrumented
  - job_name: 'sysdeck_containers'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9101']
        labels:
          module: 'containers'
          codename: 'cockpit-containers'

  - job_name: 'sysdeck_firewall'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9102']
        labels:
          module: 'firewall'
          codename: 'cockpit-firewall'

  - job_name: 'sysdeck_integrity'
