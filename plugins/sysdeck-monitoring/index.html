<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>SysDeck Monitoring</title>
    <link rel="stylesheet" href="../sysdeck-common/sysdeck.css" />
    <link rel="stylesheet" href="../sysdeck-common/sysdeck-web.css" />
    <script src="../base1/cockpit.js"></script>
    <script>
        function __sysdeckShowError(title, msg, detail) {
            var root = document.getElementById('root');
            if (!root) return;
            var html = '<div class="sysdeck-card">' +
                '<h3 class="sysdeck-card-title">' + title + '</h3>' +
                '<p class="sysdeck-card-body sysdeck-mono">' + String(msg).replace(/</g, '&lt;') + '</p>';
            if (detail) {
                html += '<pre class="sysdeck-mono" style="white-space:pre-wrap;background:#1a1a1a;padding:8px;border-radius:4px;overflow:auto;max-height:300px">' +
                    String(detail).replace(/</g, '&lt;') + '</pre>';
            }
            html += '</div>';
            root.innerHTML = html;
        }
        window.addEventListener('error', function(ev) {
            __sysdeckShowError('Page error', ev.message || 'Unknown error',
                (ev.error && ev.error.stack) ? ev.error.stack : null);
        });
        window.addEventListener('unhandledrejection', function(ev) {
            var r = ev.reason;
            __sysdeckShowError('Unhandled promise rejection',
                (r && r.message) ? r.message : String(r),
                (r && r.stack) ? r.stack : null);
        });
    </script>
    <style>
        .monitoring-tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--sysdeck-border, #333);
            margin-bottom: 1rem;
        }
        .monitoring-tab {
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            background: transparent;
            color: var(--sysdeck-muted, #888);
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 4px 4px 0 0;
            transition: all 0.15s;
        }
        .monitoring-tab:hover {
            background: rgba(6,102,204,0.08);
            color: var(--sysdeck-fg, #e0e0e0);
        }
        .monitoring-tab.active {
            background: rgba(6,102,204,0.12);
            color: var(--sysdeck-accent, #0666cc);
            border-color: var(--sysdeck-border, #333);
            border-bottom: 2px solid var(--sysdeck-accent, #0666cc);
            margin-bottom: -2px;
        }
        .monitoring-tab-panel {
            display: none;
        }
        .monitoring-tab-panel.active {
            display: block;
        }
        .monitoring-iframe {
            width: 100%;
            height: 600px;
            border: 1px solid var(--sysdeck-border, #333);
            border-radius: 4px;
            background: #1e1e1e;
        }
    </style>
</head>
<body>
    <main id="root" class="sysdeck-page">
        <div class="sysdeck-loading">Loading…</div>
    </main>
    <script type="module">
        if (!window.cockpit) {
            document.getElementById('root').innerHTML = '<div class="sysdeck-card">' +
                '<h3 class="sysdeck-card-title">cockpit.js not loaded</h3>' +
                '<p class="sysdeck-card-body">This plugin requires <code>../base1/cockpit.js</code>.</p>' +
                '</div>';
            throw new Error('window.cockpit is undefined');
        }
        try {
            const { mount } = await import("./monitoring.js");
            const { bridge, EventBus } = await import("../sysdeck-common/bridge.js");
            const root = document.getElementById('root');
            await mount(root, { bridge, EventBus });
        } catch (err) {
            __sysdeckShowError('Module load failed', err.message || String(err),
                err.stack || null);
        }
    </script>
</body>
</html>
